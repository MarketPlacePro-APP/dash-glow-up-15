name: TLWB KPI Freshness Monitor

# Attention delivery is separate from dashboard health. Diagnostics stay honest
# in the per-run artifact; only a NEW prolonged incident fails to trigger email.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: kpi-attention-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assess-attention:
    name: Assess Troy attention (see artifact for dashboard health)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test attention and repeat-suppression policy
        run: python3 -m unittest discover -s ci -p 'test_kpi_attention_monitor.py' -v
      - name: Observe real freshness and classify attention
        id: assess
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TLWB_KPI_AUTH_USERNAME: ${{ secrets.TLWB_KPI_AUTH_USERNAME }}
          TLWB_KPI_AUTH_PASSWORD: ${{ secrets.TLWB_KPI_AUTH_PASSWORD }}
        run: python3 ci/kpi_attention_monitor.py
      - name: Preserve actual health and incident continuity before notification
        uses: actions/upload-artifact@v4
        with:
          name: kpi-attention-state-v1
          path: attention-output/
          retention-days: 30
          if-no-files-found: error
      - name: New incident needs Troy attention
        if: steps.assess.outputs.notify == 'true'
        run: |
          printf '%s\n' 'TROY ATTENTION REQUIRED: see the assessment summary for impact and action. This notice is sent once per unresolved incident/severity, not on each retry.'
          exit 1
