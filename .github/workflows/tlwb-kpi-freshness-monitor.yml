name: TLWB KPI Freshness Monitor

# Independent, off-Studio staleness alarm. Polls the protected /api/status
# endpoint and fails when the latest source check predates the latest due owner
# cycle after its grace period or that check reported failure. This is the safety
# net the current Studio-resident watchdog cannot provide, because it runs even
# when the Studio is offline.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GRACE_MINUTES: "90"
      TLWB_KPI_AUTH_USERNAME: ${{ secrets.TLWB_KPI_AUTH_USERNAME }}
      TLWB_KPI_AUTH_PASSWORD: ${{ secrets.TLWB_KPI_AUTH_PASSWORD }}
    steps:
      - name: Poll /api/status and assert scheduled freshness
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT
          curl --fail-with-body -sS --retry 3 --retry-all-errors \
            -u "$TLWB_KPI_AUTH_USERNAME:$TLWB_KPI_AUTH_PASSWORD" \
            https://tlwb-kpi.vercel.app/api/status > "$status_file"
          python3 - "$GRACE_MINUTES" "$status_file" <<'PY'
          import json, sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          grace = timedelta(minutes=float(sys.argv[1]))
          raw = open(sys.argv[2], encoding="utf-8").read()
          data = json.loads(raw)
          refresh = data.get("refresh", {})
          completed = refresh.get("last_check_completed_at") or data.get("last_checked")
          result = refresh.get("last_check_result")
          if not completed:
              raise SystemExit(f"No last_check_completed_at in status payload: {raw[:300]}")

          zone = ZoneInfo("America/Denver")
          now = datetime.now(zone)
          completed_at = datetime.fromisoformat(completed.replace("Z", "+00:00")).astimezone(zone)
          candidates = []
          for day_offset in (0, -1):
              day = (now + timedelta(days=day_offset)).date()
              for hour in (8, 12, 16, 20):
                  scheduled = datetime(day.year, day.month, day.day, hour, 5, tzinfo=zone)
                  if scheduled + grace <= now:
                      candidates.append(scheduled)
          expected = max(candidates)
          age_hours = (now - completed_at).total_seconds() / 3600
          print(
              f"last_check_completed={completed_at.isoformat()} result={result} age_hours={age_hours:.2f} "
              f"latest_due_cycle={expected.isoformat()} grace_minutes={grace.total_seconds() / 60:.0f}"
          )
          if completed_at < expected:
              raise SystemExit(
                  f"STALE: latest check {completed_at.isoformat()} predates due cycle {expected.isoformat()}"
              )
          if result not in {"deployed", "no_change"}:
              raise SystemExit(f"FAILED: latest due source check result is {result!r}")
          print("OK: latest due source check completed successfully")
          PY
