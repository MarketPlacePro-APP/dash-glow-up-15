name: TLWB KPI Refresh

# Durable, off-Studio replacement for the Mac-Studio cron that publishes the
# TLWB KPI dashboard. Phase 1 (this file) runs the full source -> generate ->
# gate -> build pipeline with NO deploy, proving it runs headlessly. Flip
# deploy on (Phase 2) only after a green Phase 1 and an explicit cutover.
#
# The "Refresh now" button (api/refresh) fires repository_dispatch: tlwb-kpi-refresh
# once TLWB_DISPATCH_TOKEN is set on Vercel, so the button triggers this workflow
# directly instead of only queuing a gist request the Studio must poll. Status is
# posted back to /api/internal/refresh-work only when TLWB_WORKER_TOKEN is present,
# so this stays dormant until cutover.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Refresh request id (set by /api/refresh via repository_dispatch)"
        required: false
  repository_dispatch:
    types: [tlwb-kpi-refresh]
  schedule:
    # 08:05 / 12:05 / 16:05 / 20:05 America/Denver, covering both MDT (UTC-6)
    # and MST (UTC-7). Duplicate runs are deduped by the semantic fingerprint
    # once deploy is enabled in Phase 2.
    - cron: "5 14,18,22 * * *"
    - cron: "5 2 * * *"
    - cron: "5 15,19,23 * * *"
    - cron: "5 3 * * *"

permissions:
  contents: read

concurrency:
  group: tlwb-kpi-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TLWB_KPI_DEPLOY: "0" # Phase 1: never deploy from CI yet.
      TLWB_CI_FULL_REFRESH: "1"
      TLWB_PHASE1_STATIC_ONLY: "1" # SQLite durability remains a separate Phase 2 gate.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      TLWB_WORKER_TOKEN: ${{ secrets.TLWB_WORKER_TOKEN }}
      REQUEST_ID: ${{ github.event.inputs.request_id || github.event.client_payload.request_id }}
    steps:
      # Reproduce the workspace-main/dash-glow-up-15 layout the committed Python
      # generators expect (they resolve data paths via parents[2]).
      - name: Check out repo into workspace-main/dash-glow-up-15
        uses: actions/checkout@v4
        with:
          path: workspace-main/dash-glow-up-15

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace-main/dash-glow-up-15/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install openpyxl google-api-python-client google-auth

      # Move the button-requested state to "running" (only when a request id and
      # the worker token are present; otherwise dormant).
      - name: Mark refresh running
        if: env.REQUEST_ID != '' && env.TLWB_WORKER_TOKEN != ''
        run: |
          curl -sS -X POST https://tlwb-kpi.vercel.app/api/internal/refresh-work \
            -H "Authorization: Bearer $TLWB_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d "{\"action\":\"start\",\"request_id\":\"$REQUEST_ID\",\"message\":\"GitHub Actions is collecting sources and running gates.\"}" || true

      - name: Run refresh pipeline (no deploy)
        id: refresh
        working-directory: workspace-main/dash-glow-up-15
        run: |
          set -o pipefail
          bash ci/tlwb_kpi_ci_refresh.sh 2>&1 | tee "$GITHUB_WORKSPACE/tlwb-refresh.log"

      - name: Assert Phase 1 did not deploy
        if: steps.refresh.outcome == 'success'
        run: |
          set -euo pipefail
          grep -q "deploy skipped (Phase 1, TLWB_KPI_DEPLOY=0)" "$GITHUB_WORKSPACE/tlwb-refresh.log"
          if grep -q "TLWB_KPI_DEPLOYED" "$GITHUB_WORKSPACE/tlwb-refresh.log"; then
            echo "Unexpected deploy marker in Phase 1 log" >&2
            exit 1
          fi
          echo "OK: TLWB_KPI_DEPLOY=0; no deploy marker emitted"

      # Report the outcome back to the refresh state machine so the dashboard's
      # "Refresh now" UI resolves. Dormant unless a request id + worker token exist.
      - name: Report refresh result
        if: always() && env.REQUEST_ID != '' && env.TLWB_WORKER_TOKEN != ''
        run: |
          if [ "${{ steps.refresh.outcome }}" != "success" ]; then
            action=fail; msg="Refresh failed a validation or build gate; the prior verified build remains live."
          elif grep -q "TLWB_KPI_DEPLOYED" "$GITHUB_WORKSPACE/tlwb-refresh.log"; then
            action=complete; msg="New source data was published and verified."
          else
            action=no_change; msg="Checked all sources and gates; no material change was published."
          fi
          fp=$(grep -oE "fingerprint=[0-9a-f]{64}" "$GITHUB_WORKSPACE/tlwb-refresh.log" | tail -1 | cut -d= -f2 || true)
          curl -sS -X POST https://tlwb-kpi.vercel.app/api/internal/refresh-work \
            -H "Authorization: Bearer $TLWB_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d "{\"action\":\"$action\",\"request_id\":\"$REQUEST_ID\",\"message\":\"$msg\",\"deployed_fingerprint\":\"$fp\"}" || true

      - name: Upload built bundle + fingerprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlwb-kpi-dist
          path: |
            workspace-main/dash-glow-up-15/dist
            workspace-main/dash-glow-up-15/data/source_health.json
            workspace-main/dash-glow-up-15/data/schedule.json
            workspace-main/dash-glow-up-15/data/phase2a_audit.json
            tlwb-refresh.log
          if-no-files-found: warn
